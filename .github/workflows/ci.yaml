name: "CI"

on:
  pull_request:
    types: [ "opened", "synchronize", "edited", "reopened" ]
    paths-ignore:
      - "docs/internals/**"
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/internals/**"
  schedule:
    - cron: "0 8 * * 1" # At 08:00 on Monday
  workflow_dispatch:
    inputs: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: "read"

jobs:
  coding-standard:
    name: "Coding standard"
    runs-on: "${{ matrix.operating-system }}"

    if: |
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    strategy:
      matrix:
        include:
          - operating-system: "ubuntu-latest"
            php-version: "8.4"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "PHP"
        uses: "orisai/github-workflows/.github/actions/setup-php@v1"
        with:
          version: "${{ matrix.php-version }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Composer"
        uses: "orisai/github-workflows/.github/actions/setup-composer@v1"
        with:
          command: "make update PRE_PHP=php"

      - name: "PHP_CodeSniffer"
        uses: "orisai/github-workflows/.github/actions/php-codesniffer@v1"
        with:
          command: "make cs ARGS='--report=checkstyle -q | vendor/bin/cs2pr'"
          cache-path: "var/tools/PHP_CodeSniffer"

  lint:
    name: "Lint - PHP ${{ matrix.php-version }}"
    runs-on: "${{ matrix.operating-system }}"

    if: |
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    # src/ must parse on the oldest supported PHP, except the Latte 3 adapter: Latte 3 needs PHP 8.
    strategy:
      matrix:
        include:
          - operating-system: "ubuntu-latest"
            php-version: "7.4"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "PHP"
        uses: "orisai/github-workflows/.github/actions/setup-php@v1"
        with:
          version: "${{ matrix.php-version }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Lint"
        run: "make lint LINT_PHP=php"

  static-analysis:
    name: "Static analysis"
    runs-on: "${{ matrix.operating-system }}"

    if: |
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    # The newest dependency set on the highest supported PHP; tools/phpstan.neon fixes phpVersion to 8.4.
    strategy:
      matrix:
        include:
          - operating-system: "ubuntu-latest"
            php-version: "8.4"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "PHP"
        uses: "orisai/github-workflows/.github/actions/setup-php@v1"
        with:
          version: "${{ matrix.php-version }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Composer"
        uses: "orisai/github-workflows/.github/actions/setup-composer@v1"
        with:
          command: "make update PRE_PHP=php"

      - name: "PHPStan"
        uses: "orisai/github-workflows/.github/actions/phpstan@v1"
        with:
          command: "make phpstan"
          cache-path: "var/tools/PHPStan"

  static-analysis-profile:
    name: "Static analysis - ${{ matrix.profile }}"
    runs-on: "${{ matrix.operating-system }}"

    if: |
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    # Each profile on its highest compatible PHP; the Latte 2 profiles analyse with tools/phpstan.latte2.neon.
    strategy:
      matrix:
        include:
          - operating-system: "ubuntu-latest"
            profile: "latte2"
            php-version: "8.3"
          - operating-system: "ubuntu-latest"
            profile: "latte2-nette32"
            php-version: "8.3"
          - operating-system: "ubuntu-latest"
            profile: "latte30"
            php-version: "8.3"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "PHP"
        uses: "orisai/github-workflows/.github/actions/setup-php@v1"
        with:
          version: "${{ matrix.php-version }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Composer"
        uses: "orisai/github-workflows/.github/actions/setup-composer@v1"
        with:
          command: "make profile PROFILE=${{ matrix.profile }} PRE_PHP=php"

      - name: "PHPStan"
        uses: "orisai/github-workflows/.github/actions/phpstan@v1"
        with:
          command: "make phpstan PROFILE=${{ matrix.profile }}"
          cache-path: "var/tools/PHPStan"

  tests:
    name: "Tests"
    runs-on: "${{ matrix.operating-system }}"
    continue-on-error: "${{ matrix.experimental }}"

    if: |
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    # The newest dependency set; the lowest set and the other profiles run in tests-profile.
    strategy:
      matrix:
        operating-system: [ "ubuntu-latest" ]
        php-version: [ "8.3", "8.4" ]
        experimental: [ false ]

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "PHP"
        uses: "orisai/github-workflows/.github/actions/setup-php@v1"
        with:
          version: "${{ matrix.php-version }}"
          coverage: "pcov"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Composer"
        uses: "orisai/github-workflows/.github/actions/setup-composer@v1"
        with:
          command: "make update PRE_PHP=php"

      - name: "PHPUnit"
        uses: "orisai/github-workflows/.github/actions/phpunit@v1"
        with:
          command: "make coverage-clover"
          cache-path: "var/tools/PHPUnit"

      - name: "Coveralls"
        uses: "orisai/github-workflows/.github/actions/coveralls-php-upload@v1"
        with:
          config: "tools/.coveralls.yml"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Upload logs"
        uses: "actions/upload-artifact@v4"
        with:
          name: "Logs - Tests (${{ matrix.operating-system }}, ${{ matrix.php-version }})"
          path: "var/log"
          if-no-files-found: "ignore"

  tests-profile:
    name: "Tests - ${{ matrix.profile }}"
    runs-on: "${{ matrix.operating-system }}"
    continue-on-error: "${{ matrix.experimental }}"

    if: |
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    # lowest: composer.json's lowest dependencies (--prefer-lowest --prefer-stable) on the lowest PHP.
    strategy:
      matrix:
        include:
          - operating-system: "ubuntu-latest"
            profile: "lowest"
            php-version: "7.4"
            experimental: false
          - operating-system: "ubuntu-latest"
            profile: "latte2"
            php-version: "8.3"
            experimental: false
          - operating-system: "ubuntu-latest"
            profile: "latte2-nette32"
            php-version: "8.3"
            experimental: false
          - operating-system: "ubuntu-latest"
            profile: "latte30"
            php-version: "8.2"
            experimental: false
          - operating-system: "ubuntu-latest"
            profile: "latte30"
            php-version: "8.3"
            experimental: false

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "PHP"
        uses: "orisai/github-workflows/.github/actions/setup-php@v1"
        with:
          version: "${{ matrix.php-version }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Composer"
        uses: "orisai/github-workflows/.github/actions/setup-composer@v1"
        with:
          command: "make profile PROFILE=${{ matrix.profile }} PRE_PHP=php"

      - name: "PHPUnit"
        uses: "orisai/github-workflows/.github/actions/phpunit@v1"
        with:
          command: "make tests PROFILE=${{ matrix.profile }}"
          cache-path: "var/tools/PHPUnit"

      - name: "Upload logs"
        uses: "actions/upload-artifact@v4"
        with:
          name: "Logs - Tests (${{ matrix.profile }}, ${{ matrix.php-version }})"
          path: "var/log"
          if-no-files-found: "ignore"

  corpus:
    name: "Corpus - ${{ matrix.profile || 'default' }}"
    runs-on: "${{ matrix.operating-system }}"

    if: |
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    # Installs exactly the versions each committed manifest header records.
    strategy:
      matrix:
        include:
          - operating-system: "ubuntu-latest"
            profile: ""
            php-version: "8.4"
          - operating-system: "ubuntu-latest"
            profile: "latte2"
            php-version: "8.3"
          - operating-system: "ubuntu-latest"
            profile: "latte2-nette32"
            php-version: "8.3"
          - operating-system: "ubuntu-latest"
            profile: "latte30"
            php-version: "8.3"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "PHP"
        uses: "orisai/github-workflows/.github/actions/setup-php@v1"
        with:
          version: "${{ matrix.php-version }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Composer"
        uses: "orisai/github-workflows/.github/actions/setup-composer@v1"
        with:
          command: "make corpus-install PROFILE=${{ matrix.profile }} PRE_PHP=php"

      - name: "Harvest"
        run: "make corpus-harvest PROFILE=${{ matrix.profile }} PRE_PHP=php"

      - name: "PHPUnit"
        run: "make tests PROFILE=${{ matrix.profile }} ARGS=tests/Corpus"

  coverage-finish:
    name: "Code coverage finish"
    needs: "tests"
    runs-on: "${{ matrix.operating-system }}"

    if: |
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    strategy:
      matrix:
        include:
          - operating-system: "ubuntu-latest"
            php-version: "8.4"

    steps:
      - name: "Coveralls"
        uses: "orisai/github-workflows/.github/actions/coveralls-finish@v1"
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

  status-check:
    name: "Status check - ${{ github.workflow }}"
    runs-on: "ubuntu-latest"
    needs: [ "coding-standard", "lint", "static-analysis", "static-analysis-profile", "tests", "tests-profile", "corpus" ]

    if: "${{ always() }}"

    steps:
      - name: "Check required jobs are successful"
        uses: "orisai/github-workflows/.github/actions/status-check@v1"
        with:
          needs: "${{ toJSON(needs) }}"
